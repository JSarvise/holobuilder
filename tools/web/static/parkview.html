<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park · hololive builder</title>
<link rel="stylesheet" href="/hb.css">
<link rel="stylesheet" href="/parkview.css">
</head>
<body class="pv">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.3v.2"/></symbol>
</svg>

<div class="app">
  <nav class="rail" data-page="park"></nav>

  <main>
    <header class="pg" aria-labelledby="pvtitle">
      <div class="wrap pv-head">
        <div class="pv-pgmain">
          <h1 id="pvtitle">Park</h1>
          <p class="pg-meta"><span>Today’s symbols and the chests still closed</span><span id="readat">Reading your account…</span></p>
          <p class="pg-lede" id="pvlede">Logging into your account to read today’s park state.</p>
          <div class="pg-stats" id="pvsum"></div>
        </div>
        <div class="pv-act">
          <button class="btn pv-reread" id="reread" type="button"><svg class="i s"><use href="#i-refresh"/></svg><span id="rereadlabel">Read again</span></button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="pv-bar" role="group" aria-label="Map layers">
        <ul class="pv-legend" id="legend">
          <li><i class="pv-dot out"></i>Still out</li>
          <li><i class="pv-dot got"></i>Collected</li>
          <li><img class="pv-li-chest" src="/park/chest.png" alt="">Chest to open</li>
          <li class="lay" data-layer="opened"><img class="pv-li-chest opened" src="/park/chest.png" alt="">Opened chest</li>
          <li class="lay" data-layer="cands"><i class="pv-dot cand"></i>Possible spot</li>
        </ul>
        <div class="pv-layers" role="group" aria-label="Optional layers">
          <button class="chip" id="opened" type="button" aria-pressed="false">Opened chests</button>
          <button class="chip" id="cands" type="button" aria-pressed="false">Every possible spot</button>
        </div>
      </div>
      <p class="pv-quiet" id="quiet" hidden></p>
      <div id="out" aria-live="polite"></div>
    </div>
  </main>
</div>

<dialog class="dlg pv-zoom" id="zoom" aria-labelledby="zoomtitle">
  <div class="dlg-h"><h3 id="zoomtitle"></h3><span class="pv-zsub" id="zoomsub"></span>
    <button class="pv-x" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="pv-zbody" id="zoombody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/hb-format.js"></script>
<script src="/hb-shell.js"></script>
<script src="/hb-combo.js"></script>
<script type="module" src="/pk-app.js"></script>
</body>
</html>
