[project]
name = "hbuilder"
version = "0.1.0"
description = "Team composition optimizer for hololive Dreams"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "tools/web", "tools/visual", "tools/app", "tools/oss/test_options_glossary.py",
             "tools/refresh",
             "tools/recon/re"]
markers = [
    "slow: deselected by default; measures rather than asserts",
    "recall: deselected by default; a full search on the real data (minutes), run with -m recall",
]
addopts = "-m 'not slow and not recall'"

[tool.ruff]
line-length = 110
target-version = "py312"
# the data (~11 GB, linked in), the packaged app and the dated research scripts
extend-exclude = ["tools/recon/proxy/dumps", "build", "docs/dev/research"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",    # the formatter wraps code; long comments, strings and tables stay readable
    "E701", "E702",   # the formatter splits them
    "E731",    # small named lambdas used as sort keys and table entries
    "E741",    # `l` is the game's lane / level in the formulas the code transcribes
    "B007",    # unpacked loop names that document a tuple's shape
    "B905",    # zip() over sequences built to the same length
    "UP031",   # %-formatting kept where it mirrors the game's own format strings
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
